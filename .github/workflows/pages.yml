name: Deploy JDIH prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify metadata, navigation, assets and JavaScript
        run: node tests/sprint1.test.cjs
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Smoke test desktop, tablet and mobile widths
        run: node tests/browser-smoke.cjs
      - name: Upload responsive test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-responsive-screenshots
          path: artifacts/sprint1-detail-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html detail.html katalog.html ruang.html _site/
          cp -R assets data _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
