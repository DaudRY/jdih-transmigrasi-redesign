name: Deploy JDIH prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare transmigration map asset
        run: |
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            "https://transmigrasi.org/images/peta-kawasan.png" \
            -o assets/peta-kawasan-transmigrasi.png
          python3 - <<'PY'
          from pathlib import Path
          image = Path("assets/peta-kawasan-transmigrasi.png").read_bytes()
          assert image[:4] == bytes([137, 80, 78, 71]), "Map file must be a valid PNG"
          assert len(image) > 20000, "Map image is unexpectedly small"
          print(f"Verified map background: {len(image):,} bytes")
          PY
      - name: Verify metadata, navigation, assets and JavaScript
        run: node tests/sprint1.test.cjs
      - name: Audit internal navigation and page structure
        run: node tests/link-audit.cjs
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Smoke test desktop, tablet and mobile widths
        run: node tests/browser-smoke.cjs
      - name: Cross-browser test Chromium, Firefox and WebKit
        run: node tests/cross-browser.cjs
      - name: Upload responsive test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdih-responsive-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html detail.html katalog.html contoh.html laporan.html ruang.html telusur.html program-penyusunan.html struktur-organisasi.html _site/
          cp -R assets data _site/
      - name: Download and verify public official PDF samples
        run: node scripts/salin-pdf-sampel.cjs
      - name: Validate sample PDF manifest and download status
        run: node tests/sampel-pdf.test.cjs
      - name: Archive source-audit and PDF status for Pusdatin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdih-sampel-resmi-status
          path: _site/data/pdf-manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
